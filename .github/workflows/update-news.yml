name: Update Daily Topics

on:
  schedule:
    # 00:00 UTC = 08:00 Asia/Shanghai
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update-topics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Append today's Topics
        run: node scripts/update-topics.js

      - name: Validate content and Topics
        run: npm test && npm run validate

      - name: Commit and push Topics archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/topics
          git diff --cached --quiet && echo "No changes to commit" || \
            git commit -m "chore: append daily Topics [skip ci]" && git push
